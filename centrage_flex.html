<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centrage avec Flexbox</title>
    <style>
         .parent{
                display: flex; /*active le mode flexbox*/
                justify-content: center; /*centre horizontalement le contenu du parent*/
                align-items: center; /*centre verticalement le contenu du parent*/
                width: 500px;
                height: 300px;
                background-color: #c9b3b3;
         }
         .bloc {
                width: 200px;
                height: 100px;
                background-color: #793c3c;
         }
    </style>
</head>
<body>
    <div class="parent">
        <div class="bloc">
             Mon contenu est centré verticalement et horizontalement avec flexbox.
        </div>
    </div>
</body>
</html>
