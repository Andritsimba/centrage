<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centrage sans flex ni Grid</title>
    
    <style>
       .parent{
            position: relative; /*positionnement normal selon le flux du document*/
            width: 500px;
            height: 300px;
            background-color: #c9b3b3;
       }
       .bloc {
            width: 200px;
            height: 100px;
            background-color: #793c3c;
            position: absolute; /*positionnement est retiré du flux du document mais il se prend comme référence le positionnement relatif du parent*/
            top: 50%; /*active seulement après avoir défini un positionnement, deplacement à 50% de la hauteur du parent*/
            left: 50%;/*active seulement après avoir défini un positionnement, deplacement à 50% de la largeur du parent*/
            transform: translate(-50%, -50%); /*permet de centrer le bloc par rapport à son point d'ancrage (top: 50%, left: 50%)*/
       }

    </style>
</head>
<body>
    <div class="parent">
        <div class="bloc">
             Mon contenu est centré verticalement et horizontalement sans utiliser flexbox.
        </div>
    </div>
</body>
</html>
